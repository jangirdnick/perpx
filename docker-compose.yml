services:
  api:
    image: jangirdnick/perpx-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: perpx_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: production
      CLIENT: http://localhost:3000
    networks:
      - perpx_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: jangirdnick/perpx-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runner
    container_name: perpx_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - perpx_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  perpx_network:
    driver: bridge