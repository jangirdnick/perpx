name: Docker Build & Push

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. AWS Credentials Configure karo
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 2. AWS ECR me Login karo
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker Buildx Setup
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # 🔹 4. Build and Push Web to AWS ECR (Fully Secure via Secrets)
      - name: Build and Push Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            238337501319.dkr.ecr.ap-south-1.amazonaws.com/perpx-web:latest
            238337501319.dkr.ecr.ap-south-1.amazonaws.com/perpx-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🔹 5. Build and Push API to AWS ECR
      - name: Build and Push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            238337501319.dkr.ecr.ap-south-1.amazonaws.com/perpx-api:latest
            238337501319.dkr.ecr.ap-south-1.amazonaws.com/perpx-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
