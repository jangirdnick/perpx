name: Deploy to EC2 (SSM)

on:
  workflow_run:
    workflows: ['Docker Build & Push']
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest Docker images from CI" \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "set -e",
              "echo \">>> Starting deployment at $(date)\"",
              "cd /opt/app",
              "echo \">>> Pulling latest images\"",
              "sudo docker compose pull",
              "echo \">>> Restarting containers\"",
              "sudo docker compose up -d --force-recreate --remove-orphans",
              "echo \">>> Cleaning unused images\"",
              "sudo docker image prune -f",
              "echo \">>> Waiting for containers to stabilize\"",
              "sleep 10",
              "echo \">>> Current status\"",
              "sudo docker compose ps",
              "echo \">>> Deployment completed successfully at $(date)\""
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command to finish
        run: |
          COMMAND_ID=${{ steps.ssm.outputs.COMMAND_ID }}
          INSTANCE_ID=${{ secrets.EC2_INSTANCE_ID }}

          echo "Waiting for deployment to complete..."
          sleep 8

          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i → Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "===== Deployment Output ====="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              echo "============================="
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "===== Error Output (Stderr) ====="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              echo "===== Standard Output (Stdout) ====="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              echo "========================"
              exit 1
            fi

            sleep 8
          done

          echo "Timeout waiting for SSM command execution"
          exit 1
